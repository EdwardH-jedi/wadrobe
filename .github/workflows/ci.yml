name: CI

on:
  push:
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20, deliberately pinned: Node >= 22 exposes a native global
      # `localStorage` that shadows jsdom's Storage inside Vitest, which breaks
      # the storage-adapter suites. Vite 6 + Vitest 3 target 20 fine.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      # pytest.ini lives in backend/ and sets `pythonpath = .`, so the suite
      # must be run from that directory for `import app...` to resolve.
      - name: Test
        working-directory: backend
        run: python -m pytest -q
