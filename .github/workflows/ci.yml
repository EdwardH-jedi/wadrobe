name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run on the same ref instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (Node 24 LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 is the floor: the jsdom storage fix needs
      # --no-experimental-webstorage, which Node 20 and earlier reject. The
      # version itself comes from .nvmrc so there is one place to change it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Separate steps so a failure names itself.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium only — the suite covers browser-only behaviour (IndexedDB,
      # real reloads, downloads, multi-tab), not cross-engine rendering.
      - run: npx playwright install --with-deps chromium

      # Builds and serves the production bundle itself (see playwright.config).
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Experimental backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 is the version the backend virtualenv is built and verified on.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt

      # Run from the repository root — backend/pytest.ini sets rootdir/pythonpath.
      - run: python -m pytest backend
